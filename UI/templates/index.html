<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>授業態度評価ビューア</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      color: #333;
    }

    /* ========== アップロードセクション ========== */
    .upload-section {
      background-color: #f0f0f0;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .upload-section h2 {
      margin-top: 0;
    }

    #imageInput {
      padding: 10px;
      margin-right: 10px;
    }

    #uploadBtn {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    #uploadBtn:hover {
      background-color: #45a049;
    }

    #uploadBtn:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    .upload-status {
      margin-top: 10px;
      font-size: 14px;
    }

    .spinner {
      display: none;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4CAF50;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin-right: 10px;
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ========== ボタンセクション ========== */
    .button-section {
      margin: 20px 0;
    }

    .button-section button {
      padding: 10px 20px;
      margin-right: 10px;
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .button-section button:hover {
      background-color: #0b7dda;
    }

    /* ========== テーブルスタイル ========== */
    table {
      border-collapse: collapse;
      margin-top: 20px;
      width: 100%;
      border: 1px solid #ddd;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #4CAF50;
      color: white;
    }

    tr:hover {
      background-color: #f5f5f5;
    }

    img.thumb {
      width: 120px;
      cursor: pointer;
      border-radius: 4px;
    }

    /* ========== スコア表示 ========== */
    .score {
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 4px;
      text-align: center;
    }

    .score-good {
      background-color: #d4edda;
      color: #155724;
    }

    .score-normal {
      background-color: #fff3cd;
      color: #856404;
    }

    .score-bad {
      background-color: #f8d7da;
      color: #721c24;
    }

    /* ========== モーダル ========== */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
    }

    .modal-content {
      display: block;
      margin: 5% auto;
      max-width: 80%;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 40px;
      color: white;
      font-size: 40px;
      cursor: pointer;
    }

    /* ========== 説明モーダル用スタイル ========== */
    .info-modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
    }

    .info-modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 30px;
      border-radius: 10px;
      width: 80%;
      max-width: 800px;
      position: relative;
    }

    .info-close {
      position: absolute;
      top: 10px;
      right: 20px;
      color: #aaa;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
    }

    .info-close:hover {
      color: #000;
    }

    .clickable-value {
      cursor: pointer;
      color: #2196F3;
      text-decoration: underline;
      font-weight: bold;
    }

    .clickable-value:hover {
      color: #1976D2;
    }

    /* ========== エラー/メッセージ ========== */
    .error {
      color: #d32f2f;
      padding: 10px;
      background-color: #ffebee;
      border-radius: 4px;
      margin-top: 10px;
    }

    .success {
      color: #388e3c;
      padding: 10px;
      background-color: #e8f5e9;
      border-radius: 4px;
      margin-top: 10px;
    }

    #result {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>授業態度評価システム</h1>

    <!-- ========== アップロードセクション ========== -->
    <div class="upload-section">
      <h2>📸 画像をアップロード</h2>
      <div>
        <input type="file" id="imageInput" accept="image/*" />
        <button id="uploadBtn">検出実行</button>
      </div>
      <div class="upload-status">
        <span id="statusMessage"></span>
      </div>
    </div>

    <!-- ========== ボタンセクション ========== -->
    <div class="button-section">
      <button id="showPhotosOnlyBtn">🖼️ 写真だけ表示</button>
      <button id="showPhotosScoreBtn">📊 写真＋スコア表示</button>
      <button id="showDetailBtn">📋 詳細を全て表示</button>
      <button id="showReferenceBtn">📚 参考資料（20段階スケール）</button>
    </div>

    <!-- ========== 結果表示エリア ========== -->
    <div id="result"></div>
  </div>

  <!-- モーダル領域（画像拡大用） -->
  <div id="myModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modalImg">
  </div>

  <!-- 説明モーダル（評価方法の説明用） -->
  <div id="infoModal" class="info-modal">
    <div class="info-modal-content">
      <span class="info-close">&times;</span>
      <div id="infoContent"></div>
    </div>
  </div>

  <script>
    // ========== グローバル変数 ==========
    let allImages = [];

    // ========== ファイルアップロード処理 ==========
    document.getElementById('uploadBtn').addEventListener('click', function() {
      const fileInput = document.getElementById('imageInput');
      const file = fileInput.files[0];

      if (!file) {
        showStatus('画像を選択してください', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      const uploadBtn = document.getElementById('uploadBtn');
      uploadBtn.disabled = true;
      showStatus('🔄 処理中...', 'info');

      // detect.py 実行API呼び出し
      fetch('/api/detect', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          showStatus('✅ 検出完了！結果を読み込み中...', 'success');
          // 結果を再度読み込む
          loadImages();
          setTimeout(() => {
            showDetail();
          }, 500);
        } else {
          showStatus('❌ エラー: ' + (data.error || '検出に失敗しました'), 'error');
        }
        uploadBtn.disabled = false;
      })
      .catch(error => {
        console.error('Error:', error);
        showStatus('❌ 通信エラー: ' + error.message, 'error');
        uploadBtn.disabled = false;
      });
    });

    // ========== 画像読み込み関数 ==========
    function loadImages() {
      fetch('/api/images')
        .then(response => response.json())
        .then(data => {
          allImages = data;
          console.log('Images loaded:', allImages);
        })
        .catch(error => console.error('Error loading images:', error));
    }

    // ========== 詳細を全て表示 ==========
    function showDetail() {
      const resultDiv = document.getElementById('result');

      if (allImages.length === 0) {
        resultDiv.innerHTML = '<p style="color: #666;">表示する画像がありません。画像をアップロードしてください。</p>';
        return;
      }

      let html = '<table><thead><tr>' +
        '<th>メッシュID</th>' +
        '<th>顔画像</th>' +
        '<th>総合スコア</th>' +
        '<th>Pitch<br/>スコア</th>' +
        '<th>Pitch<br/>角度</th>' +
        '<th>Yaw<br/>スコア</th>' +
        '<th>Yaw<br/>角度</th>' +
        '<th>EAR<br/>スコア</th>' +
        '<th>EAR<br/>値</th>' +
        '<th>ランドマーク<br/>詳細</th>' +
        '</tr></thead><tbody>';

      allImages.forEach(img => {
        const scoreClass = getScoreClass(parseInt(img.total_score));
        html += '<tr>' +
          `<td>${img.mesh_id}</td>` +
          `<td><img class="thumb" src="${img.url}" alt="face" onclick="openModal('${img.url}')"></td>` +
          `<td><div class="score ${scoreClass}">${img.total_score}点</div></td>` +
          `<td>${img.pitch_score}点</td>` +
          `<td><span class="clickable-value" onclick="showPitchInfo('${img.landmark_url}', '${img.pitch_angle}')">${img.pitch_angle || '-'}°</span></td>` +
          `<td>${img.yaw_score}点</td>` +
          `<td><span class="clickable-value" onclick="showYawInfo('${img.landmark_url}', '${img.yaw_angle}')">${img.yaw_angle || '-'}°</span></td>` +
          `<td>${img.ear_score}点</td>` +
          `<td><span class="clickable-value" onclick="showEarInfo('${img.landmark_url}', '${img.ear_value}')">${img.ear_value || '-'}</span></td>` +
          `<td>${img.landmark_url ? `<img class="thumb" src="${img.landmark_url}" alt="landmarks" onclick="openModal('${img.landmark_url}')" style="cursor:pointer; border:2px solid #2196F3;">` : '-'}</td>` +
          '</tr>';
      });

      html += '</tbody></table>';
      
      // ランドマーク説明を追加
      html += '<div style="margin-top: 30px; padding: 20px; background-color: #f9f9f9; border-radius: 8px;">';
      html += '<h3 style="margin-top: 0; color: #333;">📍 使用しているメッシュポイント（ランドマーク）</h3>';
      html += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">';
      
      // Pitch/Yaw (solvePnP用)
      html += '<div style="border: 2px solid #4CAF50; padding: 15px; border-radius: 8px; background-color: white;">';
      html += '<h4 style="color: #4CAF50; margin-top: 0;">🔄 Pitch / Yaw（顔の向き）</h4>';
      html += '<p style="font-size: 13px; color: #666;">solvePnP法で6つのランドマークから3D姿勢を推定</p>';
      html += '<ul style="font-size: 14px; line-height: 1.8;">';
      html += '<li><strong>#1</strong>: 鼻先 (Nose tip)</li>';
      html += '<li><strong>#152</strong>: 顎 (Chin)</li>';
      html += '<li><strong>#33</strong>: 左目内側 (Left eye inner corner)</li>';
      html += '<li><strong>#263</strong>: 右目内側 (Right eye inner corner)</li>';
      html += '<li><strong>#61</strong>: 口角左 (Left mouth corner)</li>';
      html += '<li><strong>#291</strong>: 口角右 (Right mouth corner)</li>';
      html += '</ul>';
      html += '<p style="font-size: 12px; color: #999; margin-top: 10px;">※ これら6点の3D座標から顔の傾き（Pitch）と回転（Yaw）を計算</p>';
      html += '<p style="font-size: 12px; color: #E91E63; margin-top: 5px;"><strong>🔴 赤い円と番号</strong>で表示されます</p>';
      html += '</div>';
      
      // EAR
      html += '<div style="border: 2px solid #2196F3; padding: 15px; border-radius: 8px; background-color: white;">';
      html += '<h4 style="color: #2196F3; margin-top: 0;">👁️ EAR（目の開き具合）</h4>';
      html += '<p style="font-size: 13px; color: #666;">両目各6ポイントから開眼度を計算</p>';
      html += '<div style="margin-bottom: 10px;">';
      html += '<strong style="color: #FF9800;">左目:</strong>';
      html += '<ul style="font-size: 14px; line-height: 1.8; margin-top: 5px;">';
      html += '<li>#33, #160, #158, #133, #153, #144</li>';
      html += '</ul>';
      html += '</div>';
      html += '<div>';
      html += '<strong style="color: #FF9800;">右目:</strong>';
      html += '<ul style="font-size: 14px; line-height: 1.8; margin-top: 5px;">';
      html += '<li>#362, #385, #387, #263, #373, #380</li>';
      html += '</ul>';
      html += '</div>';
      html += '<p style="font-size: 12px; color: #999; margin-top: 10px;">※ EAR = (垂直距離平均) / (水平距離)</p>';
      html += '<p style="font-size: 12px; color: #2196F3; margin-top: 5px;"><strong>🔵 青い円と番号</strong>で表示されます</p>';
      html += '</div>';
      
      html += '</div>'; // grid終了
      
      // MediaPipe参考リンク
      html += '<div style="margin-top: 20px; padding: 15px; background-color: #e3f2fd; border-left: 4px solid #2196F3; border-radius: 4px;">';
      html += '<p style="margin: 0; font-size: 14px;"><strong>📚 詳細:</strong> MediaPipe Face Mesh は顔に478個のランドマークを配置します。</p>';
      html += '<p style="margin: 10px 0 0 0; font-size: 13px; color: #666;">参考: <a href="https://github.com/google/mediapipe/blob/master/mediapipe/modules/face_geometry/data/canonical_face_model_uv_visualization.png" target="_blank" style="color: #2196F3;">MediaPipe Face Mesh ランドマークマップ</a></p>';
      html += '</div>';
      
      html += '</div>'; // ランドマーク説明終了
      
      resultDiv.innerHTML = html;
    }

    // ========== 写真だけ表示 ==========
    function showPhotosOnly() {
      const resultDiv = document.getElementById('result');

      if (allImages.length === 0) {
        resultDiv.innerHTML = '<p style="color: #666;">表示する画像がありません。画像をアップロードしてください。</p>';
        return;
      }

      let html = '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;">';

      allImages.forEach(img => {
        html += `<div style="cursor: pointer; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">` +
          `<img src="${img.url}" style="width: 100%; height: auto; display: block;" onclick="openModal('${img.url}')" alt="face">` +
          `</div>`;
      });

      html += '</div>';
      resultDiv.innerHTML = html;
    }

    // ========== 写真とスコア表示 ==========
    function showPhotosScore() {
      const resultDiv = document.getElementById('result');

      if (allImages.length === 0) {
        resultDiv.innerHTML = '<p style="color: #666;">表示する画像がありません。画像をアップロードしてください。</p>';
        return;
      }

      let html = '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;">';

      allImages.forEach(img => {
        const scoreClass = getScoreClass(parseInt(img.total_score));
        html += `<div style="cursor: pointer; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">` +
          `<img src="${img.url}" style="width: 100%; height: auto; display: block;" onclick="openModal('${img.url}')" alt="face">` +
          `<div style="padding: 10px; background-color: #f9f9f9;">` +
          `<p style="margin: 0; text-align: center; font-weight: bold;">ID: ${img.mesh_id}</p>` +
          `<div class="score ${scoreClass}" style="margin-top: 5px;">${img.total_score}点</div>` +
          `</div>` +
          `</div>`;
      });

      html += '</div>';
      resultDiv.innerHTML = html;
    }

    // ========== 参考資料（20段階スケール）表示 ==========
    function showReference() {
      const resultDiv = document.getElementById('result');
      
      let html = '<div style="max-width: 1200px; margin: 0 auto;">';
      
      // ========== Pitch用画像生成関数 ==========
      function generatePitchFace(angle) {
        // angle: -20 (床を向く/下) ... 0 (正面) ... +20 (天井を向く/上)
        const canvas = document.createElement('canvas');
        canvas.width = 80;
        canvas.height = 80;
        const ctx = canvas.getContext('2d');

        // 背景（柔らかいグラデーションで写真風に）
        const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
        g.addColorStop(0, '#f7efe6');
        g.addColorStop(1, '#efe1ce');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 顔の輪郭（光の当たりを追加して写真っぽく）
        const faceX = 40, faceY = 40, faceR = 28;
        const rg = ctx.createRadialGradient(faceX - 6, faceY - 8, 6, faceX, faceY, faceR);
        rg.addColorStop(0, '#fff1e0');
        rg.addColorStop(0.5, '#ffe5c9');
        rg.addColorStop(1, '#f1cfa8');
        ctx.beginPath();
        ctx.arc(faceX, faceY, faceR, 0, Math.PI * 2);
        ctx.fillStyle = rg;
        ctx.fill();

        // 軽い影
        ctx.beginPath();
        ctx.ellipse(faceX, faceY + 18, faceR * 0.9, 8, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.04)';
        ctx.fill();

        // 鼻（立体感）
        ctx.beginPath();
        ctx.moveTo(40, 36);
        ctx.quadraticCurveTo(39, 44, 40, 48);
        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 目の描画（写真風: 白目->虹彩->瞳）
        // 角度が正（上向き）なら目はキャンバス上側へ移動、負（下向き）なら下へ移動
        const eyeShift = (angle / 20) * 12; // -20 -> -12 (下に), +20 -> +12 (上に)。注意: canvas座標では上が小さい値
        // 私達の定義: angle>0 => 天井を見る => 目は上へ(小さいY)。なので eyeY = baseY - eyeShift
        const baseEyeY = 34;
        const leftEyeX = 28, rightEyeX = 52;
        const eyeY = baseEyeY - eyeShift;

        // 目の開き（下向き時は少し閉じ気味にする）
        const openness = Math.max(0.25, 1 - (Math.abs(angle) / 20) * 0.45);

        function drawEye(cx, cy, open) {
          // 白目
          ctx.beginPath();
          ctx.ellipse(cx, cy, 8, 6 * open, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          // 虹彩
          ctx.beginPath();
          ctx.ellipse(cx, cy, 4, 4 * open, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#5b6b7a';
          ctx.fill();
          // 瞳
          ctx.beginPath();
          ctx.ellipse(cx, cy, 2, 2 * open, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#000000';
          ctx.fill();
          // 瞼の影（上から被せる）
          if (open < 1) {
            ctx.beginPath();
            ctx.fillStyle = 'rgba(243,225,205,1)';
            // 上瞼で一部覆う
            ctx.rect(cx - 9, cy - 6, 18, 6 - (6 * open));
            ctx.fill();
          }
        }

        drawEye(leftEyeX, eyeY, openness);
        drawEye(rightEyeX, eyeY, openness);

        // 口の描画（曲線で上向き/下向きを表現）
        const mouthBaseY = 52 - (angle / 20) * 6; // 上向きなら少し上へ
        const curve = (angle / 20) * 6 * -1; // angle>0 (上向き) -> curve negative -> 上向きの弧
        ctx.beginPath();
        ctx.moveTo(30, mouthBaseY);
        ctx.quadraticCurveTo(40, mouthBaseY + curve, 50, mouthBaseY);
        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        // 軽い肌のテクスチャ（ランダムノイズを薄く描画して写真風に見せる）
        for (let i = 0; i < 30; i++) {
          ctx.fillStyle = 'rgba(0,0,0,0.02)';
          const rx = faceX + (Math.random() - 0.5) * faceR * 1.2;
          const ry = faceY + (Math.random() - 0.5) * faceR * 1.2;
          ctx.fillRect(rx, ry, 1, 1);
        }

        return canvas.toDataURL('image/png');
      }
      
      // ========== Yaw用画像生成関数 ==========
      function generateYawFace(angle) {
        const canvas = document.createElement('canvas');
        canvas.width = 80;
        canvas.height = 80;
        const ctx = canvas.getContext('2d');

        // 背景色
        ctx.fillStyle = '#f0e4d7'; // 肌色
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 顔の輪郭
        ctx.beginPath();
        ctx.arc(40, 40, 30, 0, Math.PI * 2, true);
        ctx.fillStyle = '#ffe0bd';
        ctx.fill();

        // 目の描画
        const eyeOffset = angle * 0.3; // 角度に応じて目の位置を調整
        ctx.beginPath();
        ctx.arc(30 - eyeOffset, 35, 5, 0, Math.PI * 2, true); // 左目
        ctx.fillStyle = '#000';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(50 - eyeOffset, 35, 5, 0, Math.PI * 2, true); // 右目
        ctx.fillStyle = '#000';
        ctx.fill();

        // 口の描画
        ctx.beginPath();
        ctx.arc(40 - eyeOffset, 50, 10, 0, Math.PI, false); // 口の位置を調整
        ctx.strokeStyle = '#000';
        ctx.stroke();

        return canvas.toDataURL();
      }
      
      // Pitch スケール
      html += `
        <div style="margin-bottom: 40px;">
          <h2 style="color: #FF6B6B; border-bottom: 3px solid #FF6B6B; padding-bottom: 10px;">📐 Pitch（顔の上下傾き） - 20段階スケール</h2>
          <p style="color: #666; margin-bottom: 20px;">負の値（-）ほど床を見ている、正の値（+）ほど天井を見ているを示しています。</p>
          
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 15px; margin-bottom: 30px;">
      `;
      
      // Pitch: -20° から +20° まで 20段階
      const pitchValues = [
        {val: -20, label: '-20°', desc: '床を見ている'},
        {val: -18, label: '-18°', desc: ''},
        {val: -16, label: '-16°', desc: ''},

      `;

      const yawValues = [

        {val: -27, label: '-27°', desc: ''},
        {val: -24, label: '-24°', desc: ''},
        {val: -21, label: '-21°', desc: ''},
        {val: -18, label: '-18°', desc: '左向き'},
        {val: -15, label: '-15°', desc: ''},
        {val: -12, label: '-12°', desc: ''},
        {val: -9, label: '-9°', desc: ''},
        {val: -6, label: '-6°', desc: 'やや左向き'},
        {val: -3, label: '-3°', desc: ''},
        {val: 0, label: '0°', desc: '正面（理想）'},
        {val: 3, label: '+3°', desc: ''},
        {val: 6, label: '+6°', desc: 'やや右向き'},
        {val: 9, label: '+9°', desc: ''},
        {val: 12, label: '+12°', desc: ''},
        {val: 15, label: '+15°', desc: '右向き'},
        {val: 18, label: '+18°', desc: ''},
        {val: 21, label: '+21°', desc: ''},
        {val: 24, label: '+24°', desc: ''},
        {val: 30, label: '+30°', desc: '大きく右向き'}
      ];
      
      yawValues.forEach((y, idx) => {
        const color = y.val < -10 ? '#1976D2' : y.val < 0 ? '#42A5F5' : y.val === 0 ? '#4CAF50' : y.val < 10 ? '#FF9800' : '#FF6B6B';
        const opacity = 0.6 + (Math.abs(y.val) / 30) * 0.4;
        const imgSrc = generateYawFace(y.val);
        
        html += `
          <div style="text-align: center;">
            <img src="${imgSrc}" alt="Yaw ${y.val}°" 
                 style="width: 70px; height: 70px; border-radius: 50%; border: 3px solid ${color}; object-fit: cover; opacity: ${opacity};">
            <p style="margin: 8px 0 2px 0; font-weight: bold; color: ${color}; font-size: 13px;">${y.label}</p>
            <p style="margin: 0; font-size: 11px; color: #999;">${y.desc}</p>
          </div>
        `;
      });
      
      html += '</div></div>';
      
      // EAR スケール
      html += `
        <div style="margin-bottom: 40px;">
          <h2 style="color: #2196F3; border-bottom: 3px solid #2196F3; padding-bottom: 10px;">👁️ EAR（目の開き具合） - 20段階スケール</h2>
          <p style="color: #666; margin-bottom: 20px;">値が大きいほど目が開いています。0.20以上で「目が開いている（良好）」と判定されます。</p>
          
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 15px; margin-bottom: 30px;">
      `;
      
      // ========== EAR用画像生成関数 ==========
      function generateEARFace(earValue) {
        // earValue: 0 (完全に閉じている) ... 0.62 (最大で開いている)
        // 目だけで開き具合を表現
        const canvas = document.createElement('canvas');
        canvas.width = 80;
        canvas.height = 80;
        const ctx = canvas.getContext('2d');

        // 背景
        const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
        g.addColorStop(0, '#f7efe6');
        g.addColorStop(1, '#efe1ce');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 顔の輪郭
        const faceX = 40, faceY = 40, faceR = 28;
        const rg = ctx.createRadialGradient(faceX - 6, faceY - 8, 6, faceX, faceY, faceR);
        rg.addColorStop(0, '#fff1e0');
        rg.addColorStop(0.5, '#ffe5c9');
        rg.addColorStop(1, '#f1cfa8');
        ctx.beginPath();
        ctx.arc(faceX, faceY, faceR, 0, Math.PI * 2);
        ctx.fillStyle = rg;
        ctx.fill();

        // EAR値に対応した目の開き具合（0-0.62の範囲を0-1に正規化）
        const openness = Math.max(0, Math.min(1, earValue / 0.62));
        
        // 左目と右目を描画
        const leftEyeX = 28, rightEyeX = 52, eyeY = 35;
        
        function drawEye(cx, cy, open) {
          // 白目（アーモンド型）
          ctx.beginPath();
          ctx.ellipse(cx, cy, 10, 6 * open, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          
          // 虹彩（濃い灰色）
          ctx.beginPath();
          ctx.ellipse(cx, cy, 5, 4 * open, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#5b6b7a';
          ctx.fill();
          
          // 瞳（黒）
          ctx.beginPath();
          ctx.ellipse(cx, cy, 2.5, 2 * open, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#000000';
          ctx.fill();
          
          // 目の上の瞼（開き具合に応じて）
          if (open < 1) {
            ctx.beginPath();
            ctx.fillStyle = 'rgba(243,225,205,1)';
            ctx.rect(cx - 11, cy - 6, 22, 6 - (6 * open));
            ctx.fill();
          }
          
          // 目の下の瞼（少し）
          if (open < 0.8) {
            ctx.beginPath();
            ctx.fillStyle = 'rgba(200,180,160,0.3)';
            ctx.rect(cx - 11, cy + (6 * open), 22, 2);
            ctx.fill();
          }
          
          // 瞼の輪郭線（黒）
          ctx.beginPath();
          ctx.moveTo(cx - 11, cy - 6);
          ctx.lineTo(cx + 11, cy - 6);
          ctx.strokeStyle = 'rgba(0,0,0,0.3)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
        
        drawEye(leftEyeX, eyeY, openness);
        drawEye(rightEyeX, eyeY, openness);
        
        // 鼻（簡単な線）
        ctx.beginPath();
        ctx.moveTo(40, 36);
        ctx.quadraticCurveTo(39, 44, 40, 50);
        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        return canvas.toDataURL('image/png');
      }
      
      // EAR: 0 から 0.62 まで 20段階
      const earValuesNew = [];
      for (let i = 0; i < 20; i++) {
        const val = (i / 19) * 0.62; // 0 から 0.62 まで均等分割
        const colorValue = Math.round((i / 19) * 100);
        let color = '#D32F2F'; // 赤（閉じた）
        if (colorValue < 25) color = '#F44336';
        else if (colorValue < 40) color = '#FF6F00';
        else if (colorValue < 55) color = '#FFB300';
        else if (colorValue < 70) color = '#8BC34A';
        else color = '#00897B'; // 緑（開いた）
        
        let desc = '';
        if (i === 0) desc = '完全に閉じている';
        else if (i === 19) desc = '完全に開いている';
        
        earValuesNew.push({
          val: parseFloat(val.toFixed(3)),
          label: val.toFixed(2),
          desc: desc,
          color: color
        });
      }
      
      earValuesNew.forEach((e, idx) => {
        const imgSrc = generateEARFace(e.val);
        
        html += `
          <div style="text-align: center;">
            <img src="${imgSrc}" alt="EAR ${e.val}" 
                 style="width: 70px; height: 70px; border-radius: 50%; border: 3px solid ${e.color}; object-fit: cover;">
            <p style="margin: 8px 0 2px 0; font-weight: bold; color: ${e.color}; font-size: 13px;">${e.label}</p>
            <p style="margin: 0; font-size: 11px; color: #999;">${e.desc}</p>
          </div>
        `;
      });

      
      html += '</div></div>';
      
      // 説明
      html += `
        <div style="background-color: #f5f5f5; padding: 20px; border-radius: 8px; margin-top: 30px;">
          <h3 style="margin-top: 0; color: #333;">📊 使い方</h3>
          <ul style="line-height: 2;">
            <li><strong>Pitch（上下傾き）:</strong> 画像を上下に回転させて段階を表現しています</li>
            <li><strong>Yaw（左右回転）:</strong> 画像が実際に左右に向くように表現しています（左向き/右向き）</li>
            <li><strong>EAR（目の開き具合）:</strong> 絵文字で目の開き具合を表現しています（😴 ← → 😁）</li>
          </ul>
          <p style="color: #666; margin-bottom: 0;">各スケールは<strong>20段階</strong>に分割されており、実際の検出値との比較に使用できます。</p>
        </div>
      `;
      
      html += '</div>';
      resultDiv.innerHTML = html;
    }

          <h3 style="color: #2196F3;">🔵 測定に使用するランドマーク（青い円）</h3>
          
          <div style="background-color: #fff3e0; padding: 15px; border-left: 4px solid #FF9800; margin: 10px 0;">
            <p style="margin: 0 0 10px 0;"><strong>左目（6点）:</strong></p>
            <ul>
              <li><strong>#33</strong>: 目頭（左端）</li>
              <li><strong>#160, #158</strong>: 上まぶたの2点</li>
              <li><strong>#133, #153</strong>: 下まぶたの2点</li>
              <li><strong>#144</strong>: 目尻（右端）</li>
            </ul>
            <p style="margin: 10px 0 0 0; font-size: 14px; color: #666;">→ これらの点で<strong>目の縦幅と横幅</strong>を測定</p>

              <li><strong>#385, #387</strong>: 上まぶたの2点</li>

              <li><strong>#380</strong>: 目尻（左端）</li>

            <p style="margin: 10px 0 0 0; font-size: 14px; color: #666;">→ これらの点で<strong>目の縦幅と横幅</strong>を測定</p>

          <h3 style="color: #2196F3;">📏 計算式</h3>
          <div style="background-color: #f5f5f5; padding: 15px; border-radius: 8px; font-family: monospace; text-align: center;">
            <p style="margin: 0; font-size: 18px; font-weight: bold;">EAR = (垂直距離の平均) ÷ (水平距離)</p>
            <p style="margin: 10px 0 0 0; font-size: 14px; color: #666;">垂直距離 = 上下のまぶた間の距離（2箇所の平均）</p>
            <p style="margin: 5px 0 0 0; font-size: 14px; color: #666;">水平距離 = 目頭から目尻までの距離</p>
          </div>
          
          <div style="background-color: #e3f2fd; padding: 15px; border-radius: 8px; margin-top: 15px;">
            <p style="margin: 0;"><strong>💡 解釈:</strong></p>
            <ul style="margin: 10px 0;">
              <li><strong>0.20以上</strong>: 目がしっかり開いている（良好な授業態度）</li>
              <li><strong>0.15〜0.20</strong>: やや目が閉じ気味（集中力低下の可能性）</li>
              <li><strong>0.15未満</strong>: 目が閉じている（居眠り、眠気の可能性が高い）</li>
            </ul>
            <p style="margin: 10px 0 0 0; padding: 10px; background-color: #fff9c4; border-radius: 4px;">
              <strong>🎯 ポイント:</strong> 両目のEAR値の平均を取ることで、より正確な開眼度を測定します。

    // ========== 説明モーダルを閉じる ==========
    document.querySelector('.info-close').addEventListener('click', function() {
      document.getElementById('infoModal').style.display = 'none';
    });

    window.addEventListener('click', function(event) {
      const infoModal = document.getElementById('infoModal');
      if (event.target === infoModal) {
        infoModal.style.display = 'none';
      }
    });

    // ========== ボタンイベント ==========
    document.getElementById('showPhotosOnlyBtn').addEventListener('click', showPhotosOnly);
    document.getElementById('showPhotosScoreBtn').addEventListener('click', showPhotosScore);
    document.getElementById('showDetailBtn').addEventListener('click', showDetail);
    document.getElementById('showReferenceBtn').addEventListener('click', showReference);

    // ========== ステータス表示 ==========
    function showStatus(message, type = 'info') {
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.textContent = message;
      statusDiv.className = type;
    }

    // ========== 初期化 ==========
    loadImages();
  </script>
